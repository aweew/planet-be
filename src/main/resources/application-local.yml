spring:
  datasource:
    url: ${DB_URL:jdbc:p6spy:mysql://localhost:3306/planet?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:planet}
    password: ${DB_PASSWORD:planet-local-password}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

planet:
  storage:
    secret-key: ${PLANET_STORAGE_SECRET_KEY:local-planet-storage-key-000001}

sa-token:
  jwt-secret-key: ${JWT_SECRET_KEY:local-planet-jwt-key-0000000001}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.awe: debug
