services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: planet
      MYSQL_USER: ${DB_USERNAME:-planet}
      MYSQL_PASSWORD: ${DB_PASSWORD:-planet-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-planet-local-root-password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - planet-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - planet-redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  planet-mysql:
  planet-redis:
